[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdctl"
version = "0.2.9"
description = "Windows GUI and CLI for Discord forensic collection and analysis"
readme = {text = "Windows forensic application with a graphical interface and source CLI.", content-type = "text/markdown"}
requires-python = ">=3.10"
authors = [
  { name = "Truong Trieu Vy", email = "trieuvy9198@gmail.com" }
]
dependencies = [
  "psutil>=7.0.0",
  "Pillow>=11.0.0",
  "cryptography>=46.0.0"
]

[project.scripts]
fdctl = "fdctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
